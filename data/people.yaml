pi:
  name: "Fei Liang"
  title: "Tenured Associate Professor, Ph.D. Supervisor, Principal Investigator (PI) of the Self-Powered Intelligent Flexible Sensing Group"
  affiliation: "School of Flexible Electronics, Northwestern Polytechnical University"
  photo: "img/pi.png"
  email: "iamfliang@nwpu.edu.cn"
  bio: "Dr. Fei Liang is a Tenured Associate Professor and Ph.D. Supervisor at the School of Flexible Electronics, Northwestern Polytechnical University (NWPU). His research focuses on the design of self-powered flexible electronic materials and devices and their applications in health electronics, energy harvesting, and interfacial sensing for special equipment in aerospace and marine environments. He has published more than 30 papers in leading journals including Science Advances, Nature Communications, Matter, and Advanced Materials, and has co-authored one academic monograph. He leads projects funded by the National Natural Science Foundation of China (General Program and Young Scientists Fund) and serves as Chief Scientist of a Qinchuangyuan “Scientist + Engineer” team."
